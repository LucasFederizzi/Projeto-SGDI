<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGDI - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #333333;
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .login-card h2 {
            margin-bottom: 6px;
            color: #000000;
            font-size: 22px;
        }

        .login-card p.subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .alert-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .alert-item {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #333333;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 3px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4a9d5d;
        }

        .btn-submit {
            width: 100%;
            background-color: #4a9d5d;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #3e864f;
        }

        footer {
            background-color: #333333;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SGDI</h1>
    </header>

    <div class="main-container">
        <div class="login-card">
            <h2>Acesso ao Sistema</h2>
            <p class="subtitle">Informe suas credenciais para continuar</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="alert-list">
                {% for message in messages %}
                  <li class="alert-item">{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
    </div>

    <footer>
        SGDI v1.0 - 2024
    </footer>

</body>
</html>
