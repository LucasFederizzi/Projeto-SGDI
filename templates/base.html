<!DOCTYPE html>
<html>
<head>
    <title>SGDI - Sistema de Gestão de Demandas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1>SGDI</h1>
        {% if session.get('email') %}
        <div class="menu">
            <a href="/">Início</a>
            <a href="/nova_demanda">Nova Demanda</a>
            <form action="/buscar" method="GET" class="menu-busca">
                <input type="text" name="q" placeholder="Título, nome ou ID">
                <button type="submit">Buscar</button>
            </form>
        </div>
        {% endif %}
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>SGDI v1.0 - 2024</p>
    </div>
</body>
</html>
